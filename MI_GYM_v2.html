<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>MI GYM</title><style>
:root{--bg:#0b0b0d;--card:#18181b;--line:#303038;--txt:#fff;--mut:#aaa;--red:#e11d2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 18px 12px;position:sticky;top:0;background:#0b0b0df2;backdrop-filter:blur(15px);z-index:4}h1{margin:0;font-size:29px}h2{margin:14px 0}.mut{color:var(--mut);font-size:13px}main{max-width:700px;margin:auto;padding:8px 15px 100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.big{font-size:27px;font-weight:800}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}button,input,select{font:inherit;border-radius:11px;padding:11px;border:1px solid var(--line);width:100%;margin:4px 0}button{background:var(--red);color:#fff;border:0;font-weight:700}button.alt{background:#29292e}input,select{background:#101014;color:#fff}label{display:block;color:var(--mut);font-size:12px;margin-top:7px}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}nav{position:fixed;bottom:0;left:0;right:0;background:#151518;border-top:1px solid var(--line);display:flex;z-index:5}nav button{background:none;color:#999;border-radius:0;font-size:11px;margin:0;padding:10px 3px}nav button.on{color:#fff}.tag{display:inline-block;background:#29292e;border-radius:99px;padding:5px 9px;font-size:12px;margin:2px}.series{display:grid;grid-template-columns:32px 1fr 1fr 1fr;gap:6px;align-items:center;margin:5px 0}.series input{margin:0}.danger{background:#552027}.timer{text-align:center;font-size:48px;font-weight:800;padding:10px}.pr{color:#ff5966;font-weight:700}</style></head><body>
<header><h1>MI GYM 💪</h1><div class="mut">Registro personal · v2</div></header><main id="app"></main><nav>
<button onclick="go('inicio')">🏠<br>Inicio</button><button onclick="go('rutinas')">🏋️<br>Rutinas</button><button onclick="go('entreno')">➕<br>Entrenar</button><button onclick="go('progreso')">📈<br>Progreso</button><button onclick="go('mas')">⚙️<br>Más</button></nav>
<script>
const EX=["Sentadilla","Prensa","Peso muerto","Peso muerto rumano","Hip thrust","Extensión de rodilla","Curl femoral","Gemelos","Press banca","Press inclinado","Press militar","Aperturas","Fondos","Dominadas","Jalón al pecho","Remo con barra","Remo en máquina","Curl de bíceps","Curl martillo","Extensión de tríceps","Tríceps polea","Elevaciones laterales","Pájaros","Face pull","Abdominales","Crunch","Plancha","Zancadas","Búlgaras","Hip extension"];
const DEF={A:["Sentadilla","Press banca","Remo con barra","Press militar","Curl de bíceps"],B:["Peso muerto rumano","Press inclinado","Jalón al pecho","Hip thrust","Tríceps polea"],C:["Prensa","Búlgaras","Curl femoral","Gemelos","Elevaciones laterales"],D:["Peso muerto","Dominadas","Press banca","Remo en máquina","Face pull"]};
let d=JSON.parse(localStorage.getItem("migym2")||'{"logs":[],"peso":[],"routines":{},"unit":"kg"}');d.routines=Object.assign({},DEF,d.routines||{});const save=()=>localStorage.setItem("migym2",JSON.stringify(d));const go=x=>location.hash=x;const date=()=>new Date().toLocaleDateString("es-AR");
function render(){let t=location.hash.slice(1)||"inicio",h="";
if(t=="inicio"){let w=d.peso.at(-1);h=`<h2>Resumen</h2><div class="grid"><div class="card"><div class="mut">Peso corporal</div><div class="big">${w?w.kg+" kg":"—"}</div></div><div class="card"><div class="mut">Entrenamientos</div><div class="big">${d.logs.length}</div></div></div><div class="card"><button onclick="go('entreno')">➕ Nuevo entrenamiento</button><button class="alt" onclick="addWeight()">⚖️ Registrar peso</button></div><div class="card"><h3>Última actividad</h3>${d.logs.slice(-5).reverse().map(x=>`<div class="item"><b>${x.ex}</b> · ${x.sets.length} series<br><span class="mut">${x.date}</span></div>`).join("")||'<span class="mut">Todavía no hay entrenamientos.</span>'}</div>`}
if(t=="rutinas")h=`<h2>Mis rutinas</h2>${Object.entries(d.routines).map(([k,a])=>`<div class="card"><h3>Día ${k}</h3>${a.map((x,i)=>`<div class="item"><b>${i+1}. ${x}</b><br><span class="mut">3 series · 8–12 reps</span></div>`).join("")}<button class="alt" onclick="editRoutine('${k}')">Editar día</button></div>`).join("")}<button onclick="newRoutine()">➕ Crear rutina</button>`;
if(t=="entreno")h=`<h2>Nuevo entrenamiento</h2><div class="card"><label>Ejercicio</label><select id="sel">${EX.map(x=>`<option>${x}</option>`).join("")}</select><label>Cantidad de series</label><input id="nset" type="number" value="3" min="1" max="10"><button onclick="build()">Continuar</button></div><div id="sets"></div>`;
if(t=="progreso"){let records=EX.map(e=>{let a=d.logs.filter(x=>x.ex==e);if(!a.length)return "";let max=Math.max(...a.flatMap(x=>x.sets.map(s=>+s.kg||0)));let vol=a.reduce((z,x)=>z+x.sets.reduce((q,s)=>q+(+s.kg||0)*(+s.reps||0),0),0);return `<div class="item"><b>${e}</b> · PR ${max} kg<br><span class="mut">Volumen registrado: ${vol.toFixed(0)} kg</span></div>`}).join("");h=`<h2>Progreso 📈</h2><div class="card"><button onclick="addWeight()">⚖️ Registrar peso corporal</button>${d.peso.slice(-12).reverse().map(x=>`<div class="item">${x.date} · <b>${x.kg} kg</b></div>`).join("")||'<span class="mut">Sin registros de peso.</span>'}</div><div class="card"><h3>Récords y volumen</h3>${records||'<span class="mut">Registrá entrenamientos para verlos.</span>'}</div>`}
if(t=="mas")h=`<h2>Más</h2><div class="card"><h3>⏱️ Descanso</h3><div class="timer" id="tm">01:30</div><div class="row"><button onclick="startTimer(90)">90 s</button><button class="alt" onclick="startTimer(120)">120 s</button></div></div><div class="card"><h3>💾 Datos</h3><button onclick="exportData()">Exportar copia</button><button class="danger" onclick="clearData()">Borrar todos los datos</button></div>`;
app.innerHTML=h}
function build(){let n=Math.max(1,Math.min(10,+nset.value||3));sets.innerHTML=`<div class="card"><h3>${sel.value}</h3>${Array.from({length:n},(_,i)=>`<div class="series"><b>${i+1}</b><input id="k${i}" type="number" step=".5" placeholder="kg"><input id="r${i}" type="number" placeholder="reps"><input id="q${i}" type="number" placeholder="RIR"></div>`).join("")}<label>Observaciones</label><input id="ob" placeholder="Técnica, esfuerzo..."><button onclick="saveWorkout('${sel.value}',${n})">Guardar entrenamiento</button></div>`}
function saveWorkout(ex,n){let s=[];for(let i=0;i<n;i++)s.push({kg:document.getElementById("k"+i).value,reps:document.getElementById("r"+i).value,rir:document.getElementById("q"+i).value});d.logs.push({ex,sets:s,note:ob.value,date:date()});save();alert("Entrenamiento guardado 💪");go("progreso")}
function addWeight(){let x=prompt("Peso corporal (kg):");if(x&&+x){d.peso.push({kg:+x,date:date()});save();render()}}
function editRoutine(k){let x=prompt("Ejercicios separados por coma:",d.routines[k].join(", "));if(x!==null){d.routines[k]=x.split(",").map(s=>s.trim()).filter(Boolean);save();render()}}
function newRoutine(){let k=prompt("Nombre de la rutina (ej. E):");if(!k)return;let x=prompt("Ejercicios separados por coma:",EX.slice(0,5).join(", "));if(x){d.routines[k.toUpperCase()]=x.split(",").map(s=>s.trim()).filter(Boolean);save();render()}}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="MI_GYM_backup.json";a.click()}
function clearData(){if(confirm("¿Borrar TODOS los datos? Esta acción no se puede deshacer.")){localStorage.removeItem("migym2");location.reload()}}
let timer;function startTimer(sec){clearInterval(timer);let end=Date.now()+sec*1000;timer=setInterval(()=>{let x=Math.max(0,end-Date.now()),s=Math.ceil(x/1000);let el=document.getElementById("tm");if(el)el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(!x){clearInterval(timer);navigator.vibrate?.(300)}},200)}
addEventListener("hashchange",render);render();
</script></body></html>
